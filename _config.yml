theme: jekyll-theme-chirpy
lang: en
timezone: UTC
title: def0ult
tagline: "Security research, red team, and IT/DevOps"
avatar: /assets/anon.png
email: ""
description: "Security research, offensive security, infrastructure, reconnaissance, and technical notes."
baseurl: "/def0ult"
url: "https://def0ultt.github.io"
github:
  username: def0ultt
social:
  name: def0ult
  links:
    - https://github.com/def0ultt
    - https://medium.com/@raissiamir797
markdown: kramdown
permalink: /posts/:title/
paginate: 10
paginate_path: /page:num/
toc: true
comments:
  provider:
analytics:
  google:
    id:
  goatcounter:
    id:
plugins:
  - jekyll-archives
jekyll-archives:
  enabled:
    - categories
  layouts:
    category: category
  permalinks:
    category: /categories/:name/
collections:
  tabs:
    output: true
    sort_by: order
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
